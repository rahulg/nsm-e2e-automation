[pytest]
testpaths = tests
python_files = test_*.py
python_classes = TestE2E* TestTW*
python_functions = test_*
markers =
    ncnss394: Regression tests for NCNSS-394 LT-260 garage name/address typeahead + location auto-populate
    ncnss531: Regression tests for NCNSS-531 Cancel button fix
    ncnss27067375: Regression tests for NCNSS-27067375 LT-261 Stolen=Yes listing fix
    ncnss544: Regression tests for NCNSS-544 LT-261 in Global Search fix
    ncnss27276758: Regression tests for NCNSS-27276758 Stolen LT-261 VIN in Global Search fix
    ncnss27258416: Regression tests for NCNSS-27258416 Submitter Name (+License Plate) in LT-261 Global Search
    ncnss493: Regression tests for NCNSS-493 blank-make / core-field validation & auto-issuance guard
    ncnss27258397: Regression tests for NCNSS-27258397 ACH Deposit Report filters fix
    ncnss27303020: Tests for NCNSS-27303020 DWI LT-265A Reprint button on the LT-261 page
    tw27302845: Tests for TW 27302845 ZIP lookup length-5 guard (no append / no request storm)
    tw27242835: Tests for TW 27242835 / NCNSS-212 LT-263 re-submission after DMV rejection
    ncnss212: Tests for NCNSS-212 (TW 27242835) LT-263 re-submission after DMV rejection
    tw27366957: Tests for TW 27366957 duplicate LT-261 case numbers (dedicated D-format sequence)
    tw26162855: Tests for TW 26162855 / NCNSS-160 LT-264 letters for the Authorized Person
    tw27378469: Tests for TW 27378469 (womi:ncdmv-373) LT-263 Terms & Conditions Submit gate
    lt264nad: Tests for the LT-264 / LT-264G "Next Action Date" statement (issuance date + 32 calendar days, underlined)
    logged_defect: Strict-xfail regression tests for QA-logged open defects; they FAIL when the defect is fixed, signalling that the xfail marker should be removed
    regression: Regression test suite
    rbac: Role-based access control tests
    e2e: End-to-end cross-portal tests
    registration: Public-portal registration / NCID account-creation tests (E2E-060)
    public_portal: Public-portal UI assertion tests (E2E-055)
    core: Core workflow tests (E2E-001 through E2E-006)
    alternate: Alternate/exception flow tests (E2E-007 through E2E-012)
    multiuser: Multi-user and role-based tests (E2E-013 through E2E-016)
    edge: Edge case tests (E2E-017 through E2E-047)
    critical: Critical priority tests
    high: High priority tests
    medium: Medium priority tests
    smoke: Smoke tests (quick subset)
    paper_form: Paper form workflow tests
    payment: Payment-related tests
    nordis: Nordis mailing integration tests
    performance: Performance threshold tests
    report: Report generation tests
    fixed: Tests that were previously failing and are now passing
addopts = -v --tb=short
